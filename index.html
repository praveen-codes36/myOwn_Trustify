<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustify Auto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center min-h-screen p-5 font-mono">

    <h1 class="text-4xl font-bold text-blue-400 mb-8">Trustify 🛡️</h1>

    <div id="chat-box" class="bg-gray-800 w-full max-w-2xl h-[70vh] rounded-lg p-5 overflow-y-auto mb-5 shadow-xl border border-gray-700 space-y-4">
        <div class="p-3 bg-gray-700 rounded-lg max-w-[80%] mr-auto">
            <strong class="text-xs opacity-50 block mb-1">Trustify</strong>
            <p>Ask me anything! I'll check the verified database first. If I can't find it there, I'll use my general knowledge.</p>
        </div>
    </div>

    <div class="w-full max-w-2xl flex gap-2">
        <input type="text" id="user-input" placeholder="Type a rumor or question..." 
            class="flex-1 p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500 text-white">
        <button onclick="sendMessage()" id="send-btn"
            class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded font-bold transition-colors">
            Ask
        </button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Add User Message
            appendMessage('You', text, 'user');
            userInput.value = '';
            
            // 2. Send to Backend
            try {
                const loadingId = appendMessage('Trustify', 'Checking database...', 'bot');
                
                const response = await fetch('http://localhost:3000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }) // No toggle needed anymore
                });
                
                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                appendMessage('Trustify', data.reply || data.error, 'bot');

            } catch (err) {
                appendMessage('System', 'Connection failed. Is server.js running?', 'bot');
            }
        }

        function appendMessage(sender, text, role) {
            const div = document.createElement('div');
            const isUser = role === 'user';
            
            div.className = `p-3 rounded-lg max-w-[90%] ${isUser ? 'bg-blue-600 ml-auto' : 'bg-gray-700 mr-auto'}`;
            div.id = role === 'bot' && text === 'Checking database...' ? 'loading-msg' : '';

            // Parse Markdown
            const htmlContent = marked.parse(text);

            div.innerHTML = `
                <strong class="text-xs opacity-50 block mb-1">${sender}</strong>
                <div class="prose prose-invert prose-sm break-words">${htmlContent}</div>
            `;
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div.id || 'msg-' + Date.now();
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
